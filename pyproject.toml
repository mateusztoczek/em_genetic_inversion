[build-system]
requires= ["setuptools<82"]
build-backend= "setuptools.build_meta"

[project]
name= "em_genetic_inversion"
version= "0.1.0"
requires-python= ">=3.11"
dependencies= [
    "pandas",
    "scikit-learn",
    "pyyaml",
    "numpy",
    "benchmark-functions",
    "opfunu",
    "setuptools<81",
    "scipy",
    "streamlit"
]

[tool.setuptools.packages.find]
where= ["src"]